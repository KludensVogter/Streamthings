<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Streamthings — commands</title>
<style>
  :root {
    --bg:     rgba(13, 10, 24, 0.86);
    --edge:   rgba(145, 70, 255, 0.5);
    --accent: #b98bff;
    --chip:   rgba(145, 70, 255, 0.9);
    --good:   #00e0b8;
    --warn:   #ffb347;
    --text:   #f4f1ff;
    --muted:  #a89ec6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    padding: 14px;
    color: var(--text);
  }
  .panel {
    width: 352px;
    background: var(--bg);
    border: 1px solid var(--edge);
    border-radius: 16px;
    padding: 15px 17px 13px;
    backdrop-filter: blur(7px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    transition: opacity 0.4s;
  }

  .head { display: flex; align-items: center; gap: 9px; margin-bottom: 3px; }
  .head svg { flex-shrink: 0; }
  .head h1 {
    font-size: 14px; font-weight: 800; letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .sub {
    font-size: 12px; color: var(--muted); line-height: 1.45;
    margin-bottom: 11px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.09);
  }
  .sub b { color: var(--text); }

  /* Every command is on screen at once: one line each, no paging. */
  ul { list-style: none; }
  li {
    display: flex; align-items: baseline; gap: 9px;
    padding: 3px 0; line-height: 1.3;
  }
  .chip {
    background: var(--chip); color: #fff;
    font-size: 12.5px; font-weight: 700;
    padding: 2px 9px; border-radius: 6px;
    flex-shrink: 0; min-width: 58px; text-align: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip.mod { background: rgba(0, 224, 184, 0.85); color: #06231d; }
  .desc {
    font-size: 12.5px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .desc .alt { color: var(--muted); font-size: 11px; }
  .desc .badge {
    color: var(--good); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.04em; font-weight: 700;
  }

  /* Tighten up rather than paginate when the list is long. */
  .panel.dense li { padding: 1px 0; }
  .panel.dense .chip { font-size: 11.5px; padding: 1px 8px; min-width: 52px; }
  .panel.dense .desc { font-size: 11.5px; }

  .foot {
    margin-top: 10px; padding-top: 9px;
    border-top: 1px solid rgba(255, 255, 255, 0.09);
    font-size: 11.5px; color: var(--muted); line-height: 1.45;
  }
  .foot b { color: var(--accent); }

  .banner {
    margin-top: 11px; padding: 8px 12px; border-radius: 9px;
    background: rgba(255, 179, 71, 0.16); border: 1px solid rgba(255, 179, 71, 0.4);
    color: var(--warn); font-size: 12.5px; font-weight: 700;
    letter-spacing: 0.04em; text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="panel" id="panel" style="opacity:0">
  <div class="head">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v8a2.5 2.5 0 0 1-2.5 2.5H12l-4.5 4.2V16H5.5A2.5 2.5 0 0 1 3 13.5v-8z" fill="var(--accent)"/>
      <path d="M11 6.2h2v2.6h2.6v2H13v2.6h-2v-2.6H8.4v-2H11V6.2z" fill="var(--bg)"/>
    </svg>
    <h1 id="title"></h1>
  </div>
  <div class="sub" id="sub"></div>
  <ul id="list"></ul>
  <div class="foot hidden" id="foot"></div>
  <div class="banner hidden" id="banner"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let lastKey = '';

function esc(value) {
  return String(value === null || value === undefined ? '' : value)
    .replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
}

/** Paints the streamer's chosen look onto the page's CSS variables. */
function rgba(hex, alpha) {
  const n = parseInt(String(hex).slice(1), 16);
  if (!Number.isFinite(n)) return `rgba(13, 10, 24, ${alpha})`;
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

function applyTheme(theme) {
  if (!theme) return;
  const root = document.documentElement.style;
  root.setProperty('--accent', theme.accent);
  root.setProperty('--text', theme.text);
  root.setProperty('--chip', rgba(theme.accent, 0.9));
  root.setProperty('--bg', rgba(theme.background, theme.opacity));
  root.setProperty('--edge', theme.border ? rgba(theme.accent, 0.5) : 'transparent');
  root.setProperty('--muted', rgba(theme.text, 0.62));

  const panel = document.getElementById('panel');
  panel.style.width = `${theme.width}px`;
  panel.style.borderRadius = `${theme.radius}px`;
  // zoom reflows rather than just scaling pixels, so the panel really does
  // get bigger instead of being stretched.
  document.body.style.zoom = theme.scale;
}

function render(state) {
  const strings = state.strings || {};
  const t = (key, vars) => {
    let text = strings[key] !== undefined ? strings[key] : '';
    if (vars) {
      for (const [name, value] of Object.entries(vars)) {
        text = text.split('{' + name + '}').join(String(value));
      }
    }
    return text;
  };

  applyTheme(state.theme);

  const theme = state.theme || {};
  const commands = state.commands || [];
  const key = JSON.stringify([commands, state.mode, state.voteSeconds, strings,
    state.paused, theme.showTitle, theme.showAliases, theme.showHoldHint]);
  if (key === lastKey) return;
  lastKey = key;

  document.querySelector('.head').classList.toggle('hidden', theme.showTitle === false);
  $('title').textContent = t('overlay.title');
  $('sub').innerHTML = state.mode === 'democracy'
    ? esc(t('overlay.sub.democracy', { seconds: Math.round(state.voteSeconds || 10) }))
      .replace(/(\d+)/, '<b>$1</b>')
    : esc(t('overlay.sub.anarchy'));

  $('panel').classList.toggle('dense', commands.length > 12);

  $('list').innerHTML = commands.map((command) => {
    const bits = [];
    if (command.info) bits.push(esc(command.info));
    if (theme.showAliases !== false && command.aliases && command.aliases.length) {
      bits.push('<span class="alt">'
        + esc(t('overlay.alsoWorks', { words: command.aliases.slice(0, 3).join(', ') }))
        + '</span>');
    }
    if (command.modOnly) bits.push('<span class="badge">' + esc(t('overlay.modOnly')) + '</span>');
    return '<li><span class="chip' + (command.modOnly ? ' mod' : '') + '">'
      + esc(command.id) + '</span>'
      + '<span class="desc">' + bits.join(' &middot; ') + '</span></li>';
  }).join('');

  const foot = $('foot');
  if (state.holdExample && theme.showHoldHint !== false) {
    foot.classList.remove('hidden');
    foot.innerHTML = esc(t('overlay.holdHint', { example: state.holdExample }))
      .replace(esc(state.holdExample), '<b>' + esc(state.holdExample) + '</b>');
  } else {
    foot.classList.add('hidden');
  }

  $('banner').textContent = t('overlay.paused');
  $('banner').classList.toggle('hidden', !state.paused);
}

async function tick() {
  try {
    const response = await fetch('/state', { cache: 'no-store' });
    render(await response.json());
    $('panel').style.opacity = '1';
  } catch {
    $('panel').style.opacity = '0';
  }
}

tick();
setInterval(tick, 1500);
</script>
</body>
</html>
