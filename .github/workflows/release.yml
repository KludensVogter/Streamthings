name: Build and release

# Pushing a version tag builds the installer and publishes it to the releases
# repo, which is where the app's auto-updater looks. Running the workflow by
# hand builds the same installer but publishes nothing, so the pipeline can be
# tested without putting anything in front of users.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the release token is available
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "The RELEASES_TOKEN secret is not set on this repository."
            echo "Create a personal access token with the 'repo' scope and add it"
            echo "under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Token is present."

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "Releasing version $PKG"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # A tag publishes; a manual run only builds, so the pipeline can be
      # exercised safely before anyone cuts a real release.
      - name: Build installer
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          # The built-in GITHUB_TOKEN only has rights to this repository, so
          # writing releases to the separate releases repo needs its own token.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Streamthings-installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
